/* ============================================================
   講義清單：每完成一份講義，新增一筆物件即可
   - articles: 條號（顯示用）
   - title: 主題
   - date: 完成日期 YYYY-MM-DD
   - chapterKey: 對應 CHAPTERS 的 key（單一主分類，以主要條文所在章為準）
   - file: 講義相對路徑
   ============================================================ */
const LECTURES = [
  {
    articles: "第315條之1",
    title: "妨害秘密罪——無故窺視、竊聽、竊錄他人非公開活動",
    date: "2026-08-29",
    chapterKey: "2-28",
    file: "lectures/privacy-intrusion-315-1.html"
  }
];

/* ============================================================
   分類覆蓋地圖：第一編／第二編各自的章節清單（葉節點 key 對應 CHAPTERS）
   ============================================================ */
const TREE_1 = CHAPTERS.filter(c => c.key.startsWith("1-")).map(c => ({ key: c.key, label: c.label.split("／")[1] }));
const TREE_2 = CHAPTERS.filter(c => c.key.startsWith("2-")).map(c => ({ key: c.key, label: c.label.split("／")[1] }));

/* ============================================================
   Rendering
   ============================================================ */
const chapterMap = Object.fromEntries(CHAPTERS.map(c => [c.key, c.label]));

function countFor(key){
  return LECTURES.filter(item => item.chapterKey === key).length;
}

function initCategorySelect(){
  const select = document.getElementById('categorySelect');
  const allOption = document.createElement('option');
  allOption.value = '';
  allOption.textContent = '全部分類';
  select.appendChild(allOption);
  CHAPTERS.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.key;
    opt.textContent = c.label;
    select.appendChild(opt);
  });
}

function selectCategory(key){
  const items = LECTURES.filter(item => item.chapterKey === key);
  if (items.length === 0) return;

  if (items.length === 1){
    window.open(items[0].file, '_blank', 'noopener');
    return;
  }

  const select = document.getElementById('categorySelect');
  select.value = (select.value === key) ? '' : key;
  render();
  document.getElementById('countLabel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function makeMergedButton(labelText, leaf){
  const activeKey = document.getElementById('categorySelect').value;
  const n = countFor(leaf.key);
  const stateClass = n === 0 ? 'zero' : 'has-count';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'leaf-btn chapter-merged ' + stateClass + (activeKey === leaf.key ? ' active' : '');
  btn.disabled = (n === 0);
  btn.innerHTML = `<span>${labelText}</span><span class="badge">${n === 0 ? '–' : n}</span>`;
  btn.addEventListener('click', () => selectCategory(leaf.key));
  return btn;
}

function renderCoverageMap(){
  [["coverageGrid1", TREE_1], ["coverageGrid2", TREE_2]].forEach(([gridId, tree]) => {
    const grid = document.getElementById(gridId);
    grid.innerHTML = '';
    tree.forEach(leaf => {
      const block = document.createElement('div');
      block.className = 'chapter-block';
      block.appendChild(makeMergedButton(leaf.label, leaf));
      grid.appendChild(block);
    });
  });

  const coveredLeaves = CHAPTERS.filter(c => countFor(c.key) > 0).length;
  document.getElementById('coverageProgress').textContent =
    `已覆蓋 ${coveredLeaves} / ${CHAPTERS.length} 章 · 共 ${LECTURES.length} 篇講義`;
}

function render(){
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const categorySelectEl = document.getElementById('categorySelect');
  const category = categorySelectEl.value;
  categorySelectEl.classList.toggle('filtered', category !== '');

  const filtered = LECTURES.filter(item => {
    const matchesKeyword = !keyword ||
      item.articles.toLowerCase().includes(keyword) ||
      item.title.toLowerCase().includes(keyword);
    const matchesCategory = !category || item.chapterKey === category;
    return matchesKeyword && matchesCategory;
  }).sort((a, b) => b.date.localeCompare(a.date));

  const grid = document.getElementById('cardGrid');
  const empty = document.getElementById('emptyState');
  const count = document.getElementById('countLabel');

  count.textContent = `共 ${filtered.length} 份講義（總計 ${LECTURES.length} 份）`;

  grid.innerHTML = '';
  if (filtered.length === 0){
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    filtered.forEach(item => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = item.file;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `
        <div class="articles">${item.articles}</div>
        <div class="title">${item.title}</div>
        <div class="meta">
          <span class="tag">${chapterMap[item.chapterKey] || item.chapterKey}</span>
        </div>
        <div class="meta" style="margin-top:.5rem;">
          <span class="date">${item.date}</span>
        </div>
      `;
      grid.appendChild(a);
    });
  }

  renderCoverageMap();
}

initCategorySelect();
let searchScrollTimer = null;
document.getElementById('searchInput').addEventListener('input', () => {
  render();
  clearTimeout(searchScrollTimer);
  const keyword = document.getElementById('searchInput').value.trim();
  if (keyword){
    searchScrollTimer = setTimeout(() => {
      document.getElementById('countLabel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 500);
  }
});
document.getElementById('categorySelect').addEventListener('change', render);
render();
</script>
